<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#3f7f8c">
<title>مُخطِّط الزيارات الأسبوعية</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2048%2048'%3E%3Crect%20width='48'%20height='48'%20rx='14'%20fill='%233f7f8c'/%3E%3Cpath%20d='M24%209c-6.1%200-11%204.9-11%2011%200%208%2011%2019%2011%2019s11-11%2011-19c0-6.1-4.9-11-11-11z'%20fill='%23fbfcfd'/%3E%3Cpath%20d='M17.5%2020h3.4l1.6-4.2%203.2%208.4%201.7-4.2h3.7'%20fill='none'%20stroke='%233f7f8c'%20stroke-width='2.4'%20stroke-linecap='round'%20stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#f1f5f7;--card:#fbfcfd;--card2:#e7eef1;--line:#d6e1e6;
--ink:#333d4a;--mut:#6b7a88;
--teal:#3f7f8c;--teal-d:#35707c;--teal-soft:#e2eef1;
--sage:#7fa890;--sage-soft:#e4efe8;--sage-ink:#486d59;
--camel:#c3a179;--camel-soft:#f4eadc;--camel-ink:#8a6b45;
--lav:#9a92c4;--lav-soft:#eae7f4;--lav-ink:#6b639e;
--terra:#c4726a;--terra-soft:#f7e4e1;--terra-ink:#9c4f47;
--sh:0 2px 10px rgba(51,61,74,.06);--sh2:0 8px 26px rgba(51,61,74,.11);
}
html{-webkit-text-size-adjust:100%}
body{font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.6;min-height:100vh;font-variant-numeric:tabular-nums;padding-bottom:70px}
::selection{background:var(--teal-soft)}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:0 20px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:26px 0 16px}
.brand{display:flex;align-items:center;gap:13px}
.mark{width:46px;height:46px;flex:none;filter:drop-shadow(0 2px 6px rgba(51,61,74,.18))}
.mark .pulse{stroke-dasharray:26;stroke-dashoffset:26;animation:pulse 3.4s cubic-bezier(.4,0,.2,1) infinite}
@keyframes pulse{0%{stroke-dashoffset:26;opacity:0}10%{opacity:1}42%{stroke-dashoffset:0;opacity:1}62%{stroke-dashoffset:0;opacity:0}100%{stroke-dashoffset:26;opacity:0}}
h1{font-size:19px;font-weight:600;letter-spacing:-.2px}
.sub{font-size:12.5px;color:var(--mut)}
.hstats{display:flex;gap:8px;flex-wrap:wrap}
.schip{display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:500;color:var(--mut);box-shadow:var(--sh)}
.schip .ic{width:15px;height:15px;color:var(--teal)}
nav.tabs{position:sticky;top:10px;z-index:30;display:flex;gap:4px;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:4px;width:max-content;max-width:100%;margin:4px auto 22px;box-shadow:var(--sh);overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{display:inline-flex;align-items:center;gap:7px;border:none;background:transparent;font:inherit;font-size:13.5px;font-weight:500;color:var(--mut);padding:8px 17px;border-radius:999px;cursor:pointer;transition:.18s;white-space:nowrap}
.tab .ic{width:16px;height:16px}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--card);color:var(--teal);font-weight:600;box-shadow:var(--sh)}
.tnum{background:var(--teal-soft);color:var(--teal-d);border-radius:99px;font-size:10.5px;font-weight:600;padding:1px 7px}
.tnum:empty{display:none}
.tab.dirty::after{content:'';width:6px;height:6px;border-radius:50%;background:var(--terra);display:inline-block;margin-inline-start:4px}
.view{display:none}
.view.on{display:block;animation:viewin .32s cubic-bezier(.22,.85,.3,1)}
@keyframes viewin{from{opacity:0;transform:translateY(8px)}}
main>.view>*+*{margin-top:14px}
.stack>*+*{margin-top:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh);padding:16px 18px}
.kicker{font-size:11.5px;font-weight:600;color:var(--mut);letter-spacing:.3px;margin-bottom:9px}
.tiny{font-size:11.5px}.mut{color:var(--mut)}
.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:13.5px;font-weight:600;padding:8px 16px;border-radius:999px;cursor:pointer;transition:.16s;box-shadow:var(--sh)}
.btn .ic{width:16px;height:16px}
.btn:hover{transform:translateY(-1px);border-color:#bfd0d8}
.btn:active{transform:none}
.btn.primary{background:var(--teal);border-color:transparent;color:#fff}
.btn.primary:hover{background:var(--teal-d);border-color:transparent}
.btn.big{padding:12px 26px;font-size:15.5px}
.btn.sm{padding:6px 13px;font-size:12.5px}
.btn.terra{background:var(--terra);border-color:transparent;color:#fff}
.btn.terra:hover{background:#b26058}
.btn:disabled{opacity:.55;cursor:default;transform:none}
.icon-btn{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--mut);cursor:pointer;transition:.15s;flex:none}
.icon-btn:hover{color:var(--terra);border-color:var(--terra)}
.icon-btn .ic{width:15px;height:15px}
.pill{border:1.5px solid var(--line);background:var(--card);color:var(--mut);font:inherit;font-size:12.5px;font-weight:500;padding:4.5px 13px;border-radius:999px;cursor:pointer;transition:.14s}
.pill:hover{border-color:#b9ccd5;color:var(--ink)}
.pill.on{background:var(--teal);border-color:var(--teal);color:#fff}
.pill.on.thu{background:var(--lav);border-color:var(--lav)}
.pill.off.on{background:var(--terra-soft);border-color:#e8bcb5;color:var(--terra-ink)}
.pill.dst.on{background:var(--lav-soft);border-color:#d9d4ef;color:var(--lav-ink)}
.pill.dyp{padding:5.5px 15px;font-size:13px}
.pills{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.seg{display:inline-flex;background:var(--card2);border-radius:999px;padding:3px;gap:2px;flex:none}
.seg button{border:none;background:transparent;font:inherit;font-size:12px;font-weight:500;color:var(--mut);padding:4px 12px;border-radius:999px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:var(--sh)}
.pdot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
.pdot.d1{background:var(--sage)}.pdot.d2{background:var(--camel)}
.sw{width:40px;height:23px;border-radius:999px;background:#cfdae0;border:1px solid var(--line);position:relative;cursor:pointer;transition:.2s;flex:none;display:inline-block}
.sw::after{content:'';position:absolute;top:2px;right:2px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(51,61,74,.3);transition:.2s}
.sw.on{background:var(--teal);border-color:var(--teal)}
.sw.on::after{transform:translateX(-17px)}
.swlab{display:inline-flex;align-items:center;gap:7px;color:var(--mut);font-size:12px;cursor:pointer;border:none;background:none;font-family:inherit;padding:0}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3.5px 11px;font-size:13px;font-weight:500;border:1.5px solid transparent;transition:.15s;cursor:pointer}
.chip.c1{background:var(--sage-soft);border-color:#d5e6dc;color:var(--sage-ink)}
.chip.c2{background:var(--camel-soft);border-color:#eddcc3;color:var(--camel-ink)}
.chip.pmiss{border-style:dashed;border-color:#e0b6b0}
.chip.viol{border-color:var(--terra);box-shadow:0 0 0 2px var(--terra-soft)}
.chip.pbreak{border-style:dotted;border-color:var(--terra);box-shadow:0 0 0 2px var(--terra-soft)}
.dot{width:6px;height:6px;border-radius:50%;flex:none}
.dot.m{background:#5d7383}.dot.f{background:var(--terra)}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:2.5px 10px;font-size:11px;font-weight:600;background:var(--card2);color:var(--mut)}
.bmain{background:var(--teal-soft);color:var(--teal-d)}
.bcon{background:var(--camel-soft);color:var(--camel-ink)}
.bdist{background:var(--lav-soft);color:var(--lav-ink)}
.stepper{display:inline-flex;align-items:center;gap:3px;background:var(--card2);border-radius:999px;padding:3px}
.stepper button{width:26px;height:26px;border-radius:50%;border:none;background:var(--card);cursor:pointer;font:inherit;font-weight:600;color:var(--teal);box-shadow:var(--sh);line-height:1}
.stepper b{min-width:30px;text-align:center;font-size:14px}
.stepper .lb{font-size:12px;color:var(--mut);padding:0 8px 0 5px;font-weight:500}
.ctrl{display:flex;flex-direction:column;gap:13px}
.cline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.clab{font-size:12px;font-weight:600;color:var(--mut);white-space:nowrap}
.split{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--mut);font-weight:500}
.wbtn{border:none;font:inherit;font-size:11.5px;font-weight:600;padding:4px 12px;border-radius:999px;background:var(--terra-soft);color:var(--terra-ink);cursor:pointer}
#stale,#rnote{opacity:0;transform:translateY(3px);transition:.25s;pointer-events:none}
#stale.show,#rnote.show{opacity:1;transform:none;pointer-events:auto}
#rnote{display:inline-flex;align-items:center;background:var(--terra-soft);color:var(--terra-ink);border-radius:999px;padding:3px 11px;font-size:11.5px;font-weight:600}
.dots{display:flex;gap:5px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--sage);animation:blink 1.1s infinite}
.dots i:nth-child(2){animation-delay:.18s;background:var(--camel)}
.dots i:nth-child(3){animation-delay:.36s;background:var(--lav)}
@keyframes blink{0%,100%{opacity:.25;transform:scale(.75)}50%{opacity:1;transform:scale(1)}}
.genstat{display:flex;align-items:center;gap:15px}
.gnums{font-size:13px;color:var(--mut)}
.gnums b{color:var(--ink)}
#resMain{transition:opacity .18s ease,transform .18s ease}
#resMain.out{opacity:0;transform:translateY(6px)}
.reshead .rh-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.rh-name{display:flex;align-items:center;gap:8px}
.pname{font-weight:600;font-size:15px}
.best{background:var(--lav-soft);color:var(--lav-ink);font-size:10px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.dbtns{display:flex;gap:8px;margin-inline-start:auto;flex-wrap:wrap}
.strow{display:flex;flex-wrap:wrap;gap:5px}
.stat{background:var(--card2);border-radius:999px;padding:3px 11px;font-size:12px;color:var(--mut)}
.stat b{color:var(--ink)}
.stat.bad,.stat.bad b{background:var(--terra-soft);color:var(--terra-ink)}
.warnbox{display:flex;gap:8px;align-items:center;background:var(--terra-soft);color:var(--terra-ink);border-radius:12px;padding:8px 13px;font-size:12.5px;font-weight:500;margin-top:12px}
.warnbox .ic{width:15px;height:15px}
.dayblk{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh);padding:14px 16px}
.dayblk.thu{background:#f8f7fc;border-color:#ddd8f0}
.dayhead{display:flex;align-items:center;gap:9px;margin-bottom:11px;flex-wrap:wrap}
.dname{font-size:13px;font-weight:600;background:var(--card2);padding:4px 14px;border-radius:999px}
.thu .dname,.daycard.thu .dname{background:var(--lav-soft);color:var(--lav-ink)}
.thutag{display:inline-flex;gap:5px;align-items:center;font-size:11px;font-weight:600;color:var(--lav-ink)}
.thutag .ic{width:12px;height:12px}
.vrow{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:9px 0;flex-wrap:wrap}
.vrow+.vrow{border-top:1px dashed var(--line)}
.vloc{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.vloc b{font-size:14px;font-weight:600}
.vteam{display:flex;gap:6px;flex-wrap:wrap}
.sched.focus .chip,.mloads.focus .chip{opacity:.32}
.sched.focus .chip.hl,.mloads.focus .chip.hl{opacity:1;border-color:var(--teal);box-shadow:0 0 0 2.5px var(--teal-soft)}
.alts-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.linky{background:none;border:none;color:var(--teal);font:inherit;font-size:12px;font-weight:600;cursor:pointer;padding:0}
.linky:hover{text-decoration:underline}
.astrip{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x proximity}
.astrip::-webkit-scrollbar{height:6px}
.astrip::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
.acard{min-width:156px;text-align:right;background:var(--card2);border:1.5px solid transparent;border-radius:16px;padding:10px 12px;cursor:pointer;font:inherit;display:flex;flex-direction:column;gap:8px;transition:.16s;scroll-snap-align:start}
.acard:hover{background:var(--card);border-color:var(--line);transform:translateY(-2px)}
.acard.sel{background:var(--card);border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
.aname{font-weight:600;font-size:13px}
.wstrip{display:flex;gap:7px;align-items:flex-end;min-height:24px}
.wcol{display:flex;flex-direction:column;gap:3px}
.wcol i{width:14px;height:7px;border-radius:4px;display:block}
.wcol i.m{background:var(--teal)}.wcol i.c{background:var(--camel)}.wcol i.e{background:var(--card2)}
.pstats{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px;color:var(--mut)}
.pstats b{color:var(--ink);font-weight:600}
.pstats .bad,.pstats .bad b{color:var(--terra-ink)}
.failcard{border-color:#eccfc9}
.fhead{display:flex;gap:9px;align-items:center;font-weight:600;color:var(--terra-ink);margin-bottom:10px}
.fhead .ic{width:18px;height:18px}
.flist{display:flex;flex-direction:column;gap:7px;margin:2px 0 14px}
.flist li{list-style:none;background:var(--terra-soft);color:var(--terra-ink);border-radius:12px;padding:8px 13px;font-size:13px;font-weight:500}
.fbtns{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.idle{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:13.5px}
.idle .ic{width:18px;height:18px;color:var(--teal)}
.introbar{display:flex;align-items:center;gap:9px;color:var(--mut);font-size:13px;flex-wrap:wrap}
.introbar .ic{color:var(--teal);width:17px;height:17px}
.introbar b{color:var(--ink)}
.daygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:12px;margin-top:14px}
.daycard .dc-head{display:flex;align-items:center;gap:9px;margin-bottom:11px;flex-wrap:wrap}
.daycard .swlab{margin-inline-start:auto}
.daycard.thu{background:#f8f7fc;border-color:#ddd8f0}
.daycard.off{opacity:.55}
.daycard.off .dc-body{pointer-events:none;opacity:.55}
.msel{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:4.5px 13px;font:inherit;font-size:12.5px;color:var(--ink)}
.pblock.off{opacity:.55;pointer-events:none}
.dc-body{display:flex;flex-direction:column;gap:9px}
.dcrow{display:flex;align-items:center;gap:8px}
.dcrow>.tiny{flex:none;width:62px}
.mhead,.lhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.moff,.lrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.moff .sep{margin-inline-start:auto}
.lrow .swlab{margin-inline-start:auto}
input.name{border:none;background:transparent;font:inherit;font-weight:600;color:var(--ink);border-bottom:1.5px dashed var(--line);padding:2px 3px;min-width:96px;flex:1;max-width:180px}
input.name:focus{outline:none;border-color:var(--teal)}
.bulkbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.rem{opacity:0!important;transform:scale(.96);transition:.22s ease}
.rb-in{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.rb-t{font-size:13px;color:var(--mut)}
.rb-t b{color:var(--ink)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:12px;margin-top:14px}
.pcard{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:13px 14px;cursor:pointer;font:inherit;text-align:right;display:flex;flex-direction:column;gap:9px;box-shadow:var(--sh);transition:.16s}
.pcard:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.pcard.sel{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
.ptop{display:flex;align-items:center;justify-content:space-between;gap:6px}
.locuse{display:flex;align-items:center;gap:8px;margin-top:13px;padding-top:12px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--mut);flex-wrap:wrap}
.locuse b{color:var(--ink)}
.locuse .ic{width:15px;height:15px;color:var(--teal)}
.mloads{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:8px}
.ml{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 10px}
.ml .chip{padding:2px 9px;font-size:12.5px}
.ml .n{width:14px;text-align:center;font-weight:600;font-size:12px;color:var(--mut)}
.bar{flex:1;height:5px;background:var(--card2);border-radius:99px;overflow:hidden;min-width:18px}
.bar i{display:block;height:100%;border-radius:99px}
.bar i.p1{background:var(--sage)}.bar i.p2{background:var(--camel)}
.lg{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--mut)}
.toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%,16px);background:var(--ink);color:#fff;display:flex;gap:9px;align-items:center;padding:10px 18px;border-radius:999px;font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:.28s;z-index:60;box-shadow:var(--sh2)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast .ic{width:15px;height:15px;color:#9fd3c0}
.rv{animation:rise .5s cubic-bezier(.22,.85,.3,1) backwards;animation-delay:calc(var(--i,0)*45ms)}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.weeknav{display:inline-flex;align-items:center;gap:2px;margin-top:2px}
.wkbtn{width:22px;height:22px;border:none;background:transparent;border-radius:50%;color:var(--mut);font:inherit;font-size:16px;line-height:1;cursor:pointer}
.wkbtn:hover{background:var(--card2);color:var(--ink)}
.wklabel{border:none;background:transparent;font:inherit;font-size:12.5px;color:var(--mut);cursor:pointer;padding:1px 6px;border-radius:8px}
.wklabel:hover{background:var(--card2);color:var(--ink)}
.wklabel.cur::after{content:'';display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--sage);margin-inline-start:6px;vertical-align:middle}
.ddate{font-size:11.5px;color:var(--mut)}
.today-tag{background:var(--teal);color:#fff;font-size:10px;font-weight:600;padding:1px 8px;border-radius:999px}
.dayblk.today{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft),var(--sh)}
.pill.dyp small{display:block;font-size:10px;opacity:.75;font-weight:400;line-height:1.1}
.pill.dyp{line-height:1.25}
.toast-undo{border:none;background:rgba(255,255,255,.14);color:#fff;font:inherit;font-size:12.5px;font-weight:600;padding:3px 12px;border-radius:999px;cursor:pointer;margin-inline-start:4px}
.toast-undo:hover{background:rgba(255,255,255,.24)}
.toast.show{pointer-events:auto}
.vtoggle{margin-inline-start:auto}
.mgrid{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.mgrid-wrap{overflow-x:auto;margin:0 -4px}
.mgrid th{font-size:11.5px;font-weight:600;color:var(--mut);padding:6px 6px 8px;text-align:center;white-space:nowrap}
.mgrid th small{display:block;font-weight:400;font-size:10.5px}

<script>
const DAYS=['السبت','الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'];
const DAY_SHORT=['سبت','أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة'];
const THU=5;
const DISTL={near:'قريب',mid:'متوسط',far:'بعيد'};
const RATIOS=[{rm:1,rc:1,l:'١:١'},{rm:2,rc:1,l:'٢:١'},{rm:3,rc:1,l:'٣:١'}];
const AR='٠١٢٣٤٥٦٧٨٩';
const ar=n=>String(n).replace(/\d/g,d=>AR[+d]);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=(id,cls='ic')=>`<svg class="${cls}"><use href="#${id}"/></svg>`;
const $=s=>document.querySelector(s);
let _uid=100;const nid=()=>++_uid;
const MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const isoD=dt=>dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
function thisSaturday(){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+1)%7));return isoD(d);}
function dayDate(i){const [y,m,d]=state.weekStart.split('-').map(Number);return new Date(y,m-1,d+i);}
const fmtD=dt=>ar(dt.getDate())+' '+MONTHS[dt.getMonth()];
const dateOf=i=>fmtD(dayDate(i));
function weekLabel(){const a=dayDate(0),b=dayDate(6);return a.getMonth()===b.getMonth()?ar(a.getDate())+' – '+ar(b.getDate())+' '+MONTHS[b.getMonth()]:fmtD(a)+' – '+fmtD(b);}
const isToday=i=>isoD(dayDate(i))===isoD(new Date());
const TABS=[{id:'plan',l:'الخطة',ic:'i-cal'},{id:'days',l:'الأيام',ic:'i-days'},{id:'members',l:'الأعضاء',ic:'i-users'},{id:'locations',l:'المواقع',ic:'i-pin'},{id:'goals',l:'الأهداف',ic:'i-target'},{id:'settings',l:'الإعدادات',ic:'i-cog'},{id:'results',l:'النتائج',ic:'i-res'}];
const state={
tab:'plan',view:'day',weekStart:thisSaturday(),undo:null,_quiet:false,running:false,stale:false,plans:[],selected:null,fail:null,flexOffer:false,lastRun:null,
visits:5,visitsWanted:5,ratioIdx:1,vcap:6,bulk:{main:3,cont:1},minChanges:true,useAllDays:false,autoRegen:true,hl:null,
cap:{mainPerDay:2,conPerDay:1,pairTotal:3,pairWeighted:5},
pairs:{enabled:false,mode:'soft',rules:[]},
goals:[],
days:Array.from({length:7},(_,i)=>({on:i>=2&&i<=5,fav:'',dist:i===THU?'near':''})),
members:[
{id:nid(),name:'شوقي',pool:1,gender:'M',off:[],pref:''},
{id:nid(),name:'ميسرة',pool:1,gender:'M',off:[],pref:''},
{id:nid(),name:'اسماء',pool:1,gender:'F',off:[],pref:''},
{id:nid(),name:'شرنوبي',pool:1,gender:'M',off:[4],pref:''},
{id:nid(),name:'مريم',pool:1,gender:'F',off:[],pref:'near'},
{id:nid(),name:'حمودين',pool:1,gender:'M',off:[],pref:'near'},
{id:nid(),name:'لبني',pool:2,gender:'F',off:[],pref:''},
{id:nid(),name:'اباظة',pool:2,gender:'M',off:[],pref:''},
{id:nid(),name:'شلتوت',pool:2,gender:'M',off:[],pref:'far'},
{id:nid(),name:'اماني',pool:2,gender:'F',off:[],pref:''},
{id:nid(),name:'غادة',pool:2,gender:'F',off:[5],pref:''}
],
locations:[
{id:nid(),name:'رئيسي ١',type:'main',dist:'near',genderRule:true},
{id:nid(),name:'رئيسي ٢',type:'main',dist:'mid',genderRule:true},
{id:nid(),name:'رئيسي ٣',type:'main',dist:'far',genderRule:true},
{id:nid(),name:'متعاقد ١',type:'contracted',dist:'near',genderRule:true}
]
};
const byId=id=>state.members.find(m=>m.id===id);
const locById=id=>state.locations.find(l=>l.id===id);
const poolName=p=>p===1?'سريري':'إداري';
const workingDays=()=>state.days.map((d,i)=>d.on?i:-1).filter(i=>i>=0);
function visitsWord(n){if(n===0)return'لا زيارات';if(n===1)return'زيارة واحدة';if(n===2)return'زيارتان';if(n<11)return ar(n)+' زيارات';return ar(n)+' زيارة';}
const plural=(n,one,two,few,many)=>n===1?one:n===2?two:n<11?ar(n)+' '+few:ar(n)+' '+many;
function kCombos(arr,k){const res=[];(function rec(s,cur){if(cur.length===k){res.push(cur.slice());return;}for(let i=s;i<=arr.length-(k-cur.length);i++){cur.push(arr[i]);rec(i+1,cur);cur.pop();}})(0,[]);return res;}
function pickWeighted(arr,ws){let s=0;for(const w of ws)s+=w;let r=Math.random()*s;for(let i=0;i<arr.length;i++){r-=ws[i];if(r<=0)return arr[i];}return arr[arr.length-1];}
const teamCap=()=>({c:state.members.filter(m=>m.pool===1).length,a:state.members.filter(m=>m.pool===2).length});
const dayFits=(nm,nc,T)=>2*(nm+nc)<=T.c&&2*nm+nc<=T.a;
let _reachCache=new Map();
function reachTotals(){
const maxM=Math.min(state.cap.mainPerDay,state.locations.filter(l=>l.type==='main').length);
const maxC=Math.min(state.cap.conPerDay,state.locations.filter(l=>l.type==='contracted').length);
const T=teamCap();
const key=state.days.map(d=>d.on?1:0).join('')+'|'+maxM+'|'+maxC+'|'+T.c+'|'+T.a;
if(!_reachCache.has(key))
_reachCache.set(key,[...reach(state.days.map(d=>d.on),maxM,maxC)].map(s=>s.split(',').map(Number)));
return _reachCache.get(key);
}
function effSplit(){
const V=state.visits,r=RATIOS[state.ratioIdx],want=r.rm/(r.rm+r.rc);
if(!state.locations.length)return{nm:0,nc:0,capped:true};
const G=goalCounts();
let totals=reachTotals().filter(([m,c])=>m>=G.gm&&c>=G.gc);
if(!totals.length)totals=reachTotals();
let pool=totals.filter(([m,c])=>m+c===V);
if(!pool.length){
const best=Math.max(...totals.map(t=>t[0]+t[1]));
pool=totals.filter(([m,c])=>m+c===best);
}
if(!pool.length)return{nm:0,nc:0,capped:true};
let sel=pool[0],bd=Infinity;
for(const [m,c] of pool){
const d=Math.abs((m+c?m/(m+c):0)-want);
if(d<bd-1e-9){bd=d;sel=[m,c];}
}
return{nm:sel[0],nc:sel[1],capped:sel[0]+sel[1]!==V};
}
function compilePairs(){
const P={on:false,hard:false,list:[],with:new Map(),avoid:new Map()};
if(!state.pairs.enabled)return P;
const alive=new Set(state.members.map(m=>m.id)),seen=new Set();
for(const r of state.pairs.rules){
if(r.a===r.b||!alive.has(r.a)||!alive.has(r.b))continue;
const k=Math.min(r.a,r.b)+':'+Math.max(r.a,r.b);
if(seen.has(k))continue; seen.add(k);
const M=r.kind==='avoid'?P.avoid:P.with;
if(!M.has(r.a))M.set(r.a,new Set()); M.get(r.a).add(r.b);
if(!M.has(r.b))M.set(r.b,new Set()); M.get(r.b).add(r.a);
P.list.push({a:r.a,b:r.b,kind:r.kind});
}
P.on=P.list.length>0; P.hard=state.pairs.mode==='hard';
return P;
}
function goalLabel(g){const i=state.goals.indexOf(g);return 'هدف '+ar(i+1);}
function compileGoals(){
const list=[],issues=new Map();
const alive=new Set(state.members.map(m=>m.id));
const P=compilePairs();
const add=(g,msg)=>{if(!issues.has(g.id))issues.set(g.id,[]);issues.get(g.id).push(msg);};
const active=state.goals.filter(g=>g.on);
for(const g of active){
const people=g.people.filter(id=>alive.has(id));
const loc=locById(g.loc);
if(!loc){add(g,'اختر موقعًا');continue;}
if(g.day>=0&&!state.days[g.day].on)add(g,'يوم '+DAYS[g.day]+' ليس يوم عمل');
const ppl=people.map(byId);
const n1=ppl.filter(m=>m.pool===1).length,n2=ppl.length-n1,need2=loc.type==='main'?2:1;
if(n1>2)add(g,'الفريق يتسع لعضوين سريريين فقط');
if(n2>need2)add(g,loc.type==='main'?'الفريق يتسع لعضوين إداريين فقط':'الموقع المتعاقد يتسع لعضو إداري واحد');
if(g.day>=0)for(const m of ppl)if(m.off.includes(g.day))add(g,m.name+' في إجازة يوم '+DAYS[g.day]);
if(g.day<0&&ppl.length&&!state.days.some((d,i)=>d.on&&ppl.every(m=>!m.off.includes(i))))add(g,'لا يوم عمل يتاح فيه كل الأعضاء المحددين');
if(P.on&&P.hard)for(let i=0;i<ppl.length;i++)for(let j=i+1;j<ppl.length;j++)if(P.avoid.get(ppl[i].id)&&P.avoid.get(ppl[i].id).has(ppl[j].id))add(g,'قاعدة «ليس مع» تمنع '+ppl[i].name+' و'+ppl[j].name);
if(loc.genderRule&&ppl.length===(2+need2)){
const c=ppl.filter(m=>m.gender==='M').length;
if(!(loc.type==='main'?(c===1||c===3):(c===1||c===2)))add(g,'تشكيل الفريق يخالف قاعدة الخلط النوعي');
}
if(!issues.has(g.id))list.push({id:g.id,loc,day:g.day,people});
}

const p1=cfg.members.filter(m=>m.pool===1).length,p2=cfg.members.filter(m=>m.pool===2).length;
if(p1<2||p2<1)msgs.push('يلزم عضوان سريريان وعضو إداري على الأقل');
const key=cfg.nMain+','+cfg.nCon;
const t1=reach(cfg.dayCfg.map(d=>d.on),maxM,maxC);
if(!t1.has(key)){
let best=[0,0];
for(const t of t1){const q=t.split(',').map(Number);if(q[0]+q[1]>best[0]+best[1])best=q;}
msgs.push('الطاقة القصوى: '+ar(best[0])+' رئيسية و'+ar(best[1])+' متعاقدة');
}else{
const t2=reachOff(cfg,maxM,maxC);
if(!t2.has(key)){
let b2=[0,0];
for(const t of t2){const q=t.split(',').map(Number);if(q[0]+q[1]>b2[0]+b2[1])b2=q;}
msgs.push('مع الإجازات: الأقصى '+ar(b2[0])+' رئيسية و'+ar(b2[1])+' متعاقدة');
}
}
const short=cfg.days.filter(d=>cfg.members.filter(m=>m.pool===1&&!m.off.includes(d)).length<2||cfg.members.filter(m=>m.pool===2&&!m.off.includes(d)).length<1);
if(short.length)msgs.push('يوم '+DAYS[short[0]]+': المتاحون أقل من الحد الأدنى');
if(cfg.locs.some(l=>l.genderRule))for(const d of cfg.days){
const av=cfg.members.filter(m=>!m.off.includes(d));
if(av.length&&av.every(m=>m.gender===av[0].gender)){
msgs.push('يوم '+DAYS[d]+': المتاحون من نوع واحد والخلط مطلوب');break;
}
}
if(cfg.goals.length){
const gm=cfg.goals.filter(g=>g.loc.type==='main').length,gc=cfg.goals.length-gm;
if(gm>cfg.nMain||gc>cfg.nCon)msgs.push('الأهداف تحتاج '+ar(gm)+' رئيسية و'+ar(gc)+' متعاقدة — ارفع عدد الزيارات أو غيّر النسبة');
else if(!msgs.length)msgs.push('الأهداف المحددة تضيّق الحل — جرّب تخفيف الأيام أو الأعضاء المحددين فيها');
}
if(!msgs.length)msgs.push('القيود ضيقة — قلّل الزيارات أو الإجازات');
msgs.unshift(...diagnosePairs(cfg));
return msgs.slice(0,3);
}

function startGen(mode){
const cfg=buildCfg();
cfg.relax=mode==='flex';
const run=++genRun;
const T=teamCap();
const pre=!cfg.days.length?'لا توجد أيام عمل مفعّلة':!cfg.locs.length?'أضف موقعًا واحدًا على الأقل':!cfg.members.length?'أضف أعضاء أولًا':(T.c<2||T.a<1)?'يلزم عضوان سريريان وعضو إداري على الأقل':state.vcap<=0?'لا طاقة زيارات بهذه الإعدادات':'';
if(pre){
state.running=false;state.plans=[];state.selected=null;state.lastRun=null;state.flexOffer=false;state.stale=false;
state.fail=[pre];state._quiet=false;
{const s=$('#stale');if(s)s.classList.remove('show');}
{const tb=document.querySelector('.tab[data-id="plan"]');if(tb)tb.classList.remove('dirty');}
updateGenUI();updateLastRun();renderResults();
const tn=$('#tnum');if(tn)tn.textContent='';
return;
}
state.running=true;state.fail=null;state.stale=false;
{const s=$('#stale');if(s)s.classList.remove('show');}
{const tb=document.querySelector('.tab[data-id="plan"]');if(tb)tb.classList.remove('dirty');}
updateGenUI();renderResults();
const sel=state.plans[state.selected];
const useRef=state.minChanges&&!!sel;
const refMD=new Set(),refTR=new Set();
if(useRef)for(const r of sel.rows)for(const id of r.team){refMD.add(id+':'+r.day);refTR.add(id+':'+r.day+':'+r.loc.id);}
const refSlots=useRef?sel.rows.map(r=>({loc:r.loc,day:r.day})):null;
const pool=new Map();
let attempts=0;
const t0=performance.now(),soft=t0+560,hard=t0+(mode==='flex'?2000:1500),target=14;
(function chunk(){
if(run!==genRun)return;
const c0=performance.now();
while(performance.now()-c0<22){
attempts++;
const slots=buildSlots(cfg,refSlots);
if(slots){
const sol=solveTeams(cfg,slots,{relax:mode==='flex',refMD,refTR});
if(sol){
const h=hashSol(slots,sol);
if(!pool.has(h))pool.set(h,makePlan(cfg,slots,sol,useRef?sel:null));
}
}
if((pool.size>=target&&performance.now()>soft)||performance.now()>hard||attempts>=9000)break;
}
if(run!==genRun)return;
const gn=$('#gn'),gf=$('#gf');
if(gn)gn.textContent=ar(attempts);
if(gf)gf.textContent=ar(pool.size);
const now=performance.now();
if((pool.size>=target&&now>soft)||now>hard||attempts>=9000){finishGen(mode,cfg,pool,attempts);return;}
setTimeout(chunk,0);
})();
}
function finishGen(mode,cfg,pool,attempts){
state.running=false;state.lastRun={attempts,found:pool.size};
const all=[...pool.values()];
if(!all.length){
state.plans=[];state.selected=null;state.flexOffer=mode!=='flex';
state.fail=diagnose(cfg);
if(mode==='flex')state.fail.unshift('لا حل حتى مع الوضع المرن');
}else{
all.forEach(p=>p.score=scorePlan(p));
all.sort((a,b)=>b.score-a.score);
const want=6,picked=[];let thr=0.34;
while(picked.length<want){
for(const p of all){
if(picked.length>=want)break;
if(!picked.includes(p)&&picked.every(q=>diffPlans(p,q)>=thr))picked.push(p);
}
if(thr<=0)break;
thr=thr>0.04?thr/2:0;
}
state.plans=picked;state.selected=0;state.flexOffer=false;state.fail=null;
}
updateGenUI();updateLastRun();renderResults();
const tn=$('#tnum');if(tn)tn.textContent=state.plans.length?ar(state.plans.length):'';
if(all.length&&!state._quiet)toast('جاهزة: '+plural(state.plans.length,'خطة واحدة','خطتان','خطط','خطة'));
state._quiet=false;
}

const sp=effSplit(),el=$('#lcount');
if(!el)return;
el.innerHTML=state.locations.length
?`<b>${ar(m)}</b> رئيسي · <b>${ar(state.locations.length-m)}</b> متعاقد`
:'لا مواقع';
}
function addLoc(type){
const base=type==='main'?'رئيسي ':'متعاقد ';
const used=new Set(state.locations.map(l=>l.name));
let n=state.locations.filter(l=>l.type===type).length+1;
while(used.has(base+ar(n)))n++;
const l={id:nid(),name:base+ar(n),type,dist:'',genderRule:true};
state.locations.push(l);
return l;
}
function removeMember(id){
const idx=state.members.findIndex(m=>m.id===id);if(idx<0)return;
const gone=state.members[idx],goneRules=state.pairs.rules.filter(r=>r.a===id||r.b===id);
state.members=state.members.filter(m=>m.id!==id);
state.pairs.rules=state.pairs.rules.filter(r=>r.a!==id&&r.b!==id);
if(state.hl===id)state.hl=null;
const card=document.querySelector('[data-mcard="'+id+'"]');
if(card){card.classList.add('rem');setTimeout(()=>card.remove(),240);}
 $('#mIntro').innerHTML=memberIntroHTML();
recalcCap();
state.plans=[];state.selected=null;state.fail=null;
const tn=$('#tnum');if(tn)tn.textContent='';
patchHeader();markStale();renderResults();
setUndo('حُذف '+esc(gone.name),()=>{
state.members.splice(idx,0,gone);state.pairs.rules.push(...goneRules);
refreshMembers();recalcCap();patchHeader();markStale();
});
}
function refreshMembers(){
 $('#mlist').innerHTML=state.members.map((m,i)=>memberCardHTML(m,i)).join('');
 $('#mIntro').innerHTML=memberIntroHTML();
}
function addMember(){
const m={id:nid(),name:'',pool:1,gender:'M',off:[],pref:''};
state.members.push(m);
 $('#mlist').insertAdjacentHTML('beforeend',memberCardHTML(m,0));

const inp=document.querySelector('input[data-name="'+m.id+'"]');

m.name='عضو '+ar(state.members.length);
if(inp)inp.placeholder=m.name;
recalcCap();patchHeader();markStale();
}
function removeLocation(id){
const idx=state.locations.findIndex(l=>l.id===id);if(idx<0)return;
const gone=state.locations[idx];
state.locations=state.locations.filter(l=>l.id!==id);
const card=document.querySelector('[data-lcard="'+id+'"]');
if(card){card.classList.add('rem');setTimeout(()=>card.remove(),240);}
patchLocIntro();patchHeader();recalcCap();
state.plans=[];state.selected=null;state.fail=null;
const tn=$('#tnum');if(tn)tn.textContent='';
markStale();renderResults();
setUndo('حُذف '+esc(gone.name),()=>{

 $('#llist').innerHTML=state.locations.map((l,i)=>locationCardHTML(l,i)).join('');

function bulkAdd(){
if(!state.bulk.main&&!state.bulk.cont)return;
const added=[];
for(let i=0;i<state.bulk.main;i++)added.push(addLoc('main'));
for(let i=0;i<state.bulk.cont;i++)added.push(addLoc('contracted'));
added.forEach(l=>$('#llist').insertAdjacentHTML('beforeend',locationCardHTML(l,0)));
patchLocIntro();patchHeader();recalcCap();markStale();
}

function goalsTabHTML(){

function refreshGoals(){const w=$('#goalsWrap');if(w)w.innerHTML=goalsTabHTML();}
function goalChanged(){refreshGoals();recalcCap();markStale();}
function addGoal(){
if(!state.locations.length){toast('أضف موقعًا أولًا');return;}
const used=new Set(state.goals.map(g=>g.loc));
const loc=state.locations.find(l=>!used.has(l.id))||state.locations[0];
state.goals.push({id:nid(),on:true,loc:loc.id,day:-1,people:[]});
goalChanged();
}
function removeGoal(id){
const idx=state.goals.findIndex(g=>g.id===id);if(idx<0)return;
const gone=state.goals[idx];
state.goals.splice(idx,1);
goalChanged();
setUndo('حُذف الهدف',()=>{state.goals.splice(idx,0,gone);goalChanged();});
}
function toggleGoalPerson(g,mid){
const m=byId(mid);if(!m)return;
const i=g.people.indexOf(mid);
if(i>=0){g.people.splice(i,1);goalChanged();return;}
const loc=locById(g.loc);
const cap=m.pool===1?2:(loc&&loc.type==='contracted'?1:2);
const same=g.people.filter(id=>{const x=byId(id);return x&&x.pool===m.pool;});
if(same.length>=cap){
if(cap===1){g.people=g.people.filter(id=>id!==same[0]);}
else{toast('الحد '+ar(cap)+' '+(m.pool===1?'سريري':'إداري')+' في الفريق');return;}
}
g.people.push(mid);
goalChanged();
}
function miniStrip(p){
const wd=p.days.slice().sort((a,b)=>a-b);
return `<div class="wstrip">${wd.map(d=>{
const qs=p.rows.filter(r=>r.day===d);
return `<span class="wcol">${qs.length?qs.map(r=>`<i class="${r.loc.type==='main'?'m':'c'}"></i>`).join(''):'<i class="e"></i>'}</span>`;
}).join('')}</div>`;
}
function schedHTML(p){
const days=[...new Set(p.rows.map(r=>r.day))].sort((a,b)=>a-b);
let k=1;
return days.map(d=>{
const rows=p.rows.filter(r=>r.day===d);
const dp=state.days[d];
const vrows=rows.map(r=>{
const team=r.team.map(id=>{
const m=byId(id);if(!m)return'';
const miss=r.miss.includes(id),viol=r.viol.includes(id),pbreak=r.pbreak&&r.pbreak.includes(id),rq=r.req&&r.req.includes(id);
return `<span class="chip c${m.pool}${miss?' pmiss':''}${viol?' viol':''}${pbreak?' pbreak':''}${rq?' req':''}" data-act="hl" data-m="${m.id}" title="${esc(m.name)} — ${poolName(m.pool)}${rq?' — محدد بالهدف':''}${miss?' — خارج تفضيله':''}${viol?' — يومان متتاليان':''}${pbreak?' — تعارض اقتران':''}">${rq?icon('i-lock','ic lk'):''}<i class="dot ${m.gender==='M'?'m':'f'}"></i>${esc(m.name)}</span>`;
}).join('');
const gi=r.goal?state.goals.findIndex(g=>g.id===r.goal):-1;
return `<div class="vrow${r.goal?' goal':''}"><div class="vloc"><b>${esc(r.loc.name)}</b>${r.goal?`<span class="badge bgoal">${icon('i-target')}${gi>=0?'هدف '+ar(gi+1):'هدف'}</span>`:''}<span class="badge ${r.loc.type==='main'?'bmain':'bcon'}">${r.loc.type==='main'?'رئيسي':'متعاقد'}</span>${r.loc.dist?`<span class="badge bdist">${DISTL[r.loc.dist]}</span>`:''}</div><div class="vteam">${team}</div></div>`;
}).join('');
return `<div class="dayblk rv${dp.dist==='near'?' thu':''}${isToday(d)?' today':''}" style="--i:${k++}">
<div class="dayhead"><span class="dname">${DAYS[d]}</span><span class="ddate">${dateOf(d)}</span>${isToday(d)?'<span class="today-tag">اليوم</span>':''}${dp.dist?`<span class="thutag">${icon('i-pin')} ${DISTL[dp.dist]}</span>`:''}${dp.fav?`<span class="badge ${dp.fav==='main'?'bmain':'bcon'}">${dp.fav==='main'?'رئيسية':'متعاقد'}</span>`:''}<span class="tiny mut" style="margin-inline-start:auto">${visitsWord(rows.length)}</span></div>
 ${vrows}
</div>`;
}).join('');
}
function memberGridHTML(p){
const days=p.days.slice().sort((a,b)=>a-b);
const head=`<tr><th></th>${days.map(d=>`<th class="${isToday(d)?'today':''}">${DAY_SHORT[d]}<small>${ar(dayDate(d).getDate())}</small></th>`).join('')}<th>المجموع</th></tr>`;
const rows=state.members.map(m=>{
let t=0;
const cells=days.map(d=>{
const r=p.rows.find(x=>x.day===d&&x.team.includes(m.id));
if(r){t++;return `<td><span class="cell ${r.loc.type==='main'?'m':'c'}">${r.goal?'◎ ':''}${esc(r.loc.name)}</span></td>`;}
if(m.off.includes(d))return '<td><span class="cell off">إجازة</span></td>';
return '<td><span class="cell no">–</span></td>';
}).join('');
return `<tr data-mrow="${m.id}"><td><span class="chip c${m.pool}" data-act="hl" data-m="${m.id}"><i class="dot ${m.gender==='M'?'m':'f'}"></i>${esc(m.name)}</span></td>${cells}<td class="tot">${ar(t)}</td></tr>`;
}).join('');
return `<div class="card rv" style="--i:1"><div class="mgrid-wrap"><table class="mgrid"><thead>${head}</thead><tbody>${rows}</tbody></table></div></div>`;
}

 ${p.consecViol?`<span class="bad"><b>${ar(p.consecViol)}</b> مخالفة</span>`:''}
</div>
</button>`;
}
function rdetailHTML(p){
const maxC=Math.max(1,...state.members.map(m=>p.counts.get(m.id)||0));
const loads=state.members.map(m=>{
const c=p.counts.get(m.id)||0;
return `<div class="ml"><span class="chip c${m.pool}" data-act="hl" data-m="${m.id}"><i class="dot ${m.gender==='M'?'m':'f'}"></i>${esc(m.name)}</span><span class="n">${ar(c)}</span><span class="bar"><i class="p${m.pool}" style="width:${Math.round(c/maxC*100)}%"></i></span></div>`;
}).join('');
const lu=new Map();
for(const r of p.rows)lu.set(r.loc.id,(lu.get(r.loc.id)||0)+1);
const locs=[...lu.entries()].map(([id,c])=>{const l=state.locations.find(x=>x.id===id);return l?`${esc(l.name)} <b>×${ar(c)}</b>`:'';}).filter(Boolean).join(' · ');
return `<div class="card rdetail rv">
<div class="dayhead" style="margin-bottom:12px"><span class="dname">أحمال خطة ${ar((state.selected??0)+1)}</span><span class="lg"><i class="pdot d1"></i>سريري</span><span class="lg"><i class="pdot d2"></i>إداري</span><span class="tiny mut" style="margin-inline-start:auto">اضغط اسمًا لتمييزه</span></div>
<div class="mloads">${loads}</div>
 ${locs?`<div class="locuse">${icon('i-pin')}<span>${locs}</span></div>`:''}
 ${p.consecViol?`<div class="warnbox">${icon('i-alert')} ${ar(p.consecViol)} مخالفة تتابع (وضع مرن)</div>`:''}
</div>`;
}
function resultsTabHTML(){
if(state.running)return `<div class="card idle rv"><div class="dots"><i></i><i></i><i></i></div><span>جارٍ توليد الخطط…</span></div>`;
if(!state.plans.length){
if(state.fail)return failHTML();
return `<div class="card idle rv">${icon('i-res')} لا نتائج بعد</div>`;
}
const sel=state.plans[state.selected];
const bar=`<div class="card rbar rv">
<div class="rb-in">
<span class="rb-t">${plural(state.plans.length,'خطة واحدة','خطتان','خطط','خطة')} · المختارة <b id="rselname">خطة ${ar(state.selected+1)}</b></span>
<span id="rnote">تغيّرت المدخلات</span>
<button type="button" class="swlab" role="switch" aria-checked="${state.minChanges?'true':'false'}" data-act="minch" title="الحفاظ على الخطة المختارة قدر الإمكان"><span class="sw${state.minChanges?' on':''}"></span> أقل تغييرًا</button>
<span style="flex:1"></span>
<button class="btn sm" data-act="copy">${icon('i-copy')} نسخ</button>
<button class="btn sm primary" data-act="gomain">عرض الجدول</button>
</div>
</div>`;
return bar+`<div class="rgrid">${state.plans.map((p,i)=>pcardHTML(p,i)).join('')}</div>`+`<div id="rdetail">${rdetailHTML(sel)}</div>`;
}
function renderResults(){
 $('#res').innerHTML=resHTML();
 $('#resTab').innerHTML=resultsTabHTML();
paintHl();
}
function selectPlan(i){
if(!state.plans[i]||i===state.selected)return;
state.selected=i;
const rm=$('#resMain');
if(rm){
rm.classList.add('out');
setTimeout(()=>{rm.innerHTML=resMainInner();rm.classList.remove('out');paintHl();},180);
}
document.querySelectorAll('#resAlts .acard').forEach(c=>c.classList.toggle('sel',+c.dataset.i===i));
document.querySelectorAll('.pcard').forEach(c=>c.classList.toggle('sel',+c.dataset.i===i));
const rn=$('#rselname');if(rn)rn.textContent='خطة '+ar(i+1);
const rd=$('#rdetail');if(rd)rd.innerHTML=rdetailHTML(state.plans[i]);
paintHl();
}
function paintHl(){
const id=state.hl??hoverM;
document.querySelectorAll('.sched,.mloads').forEach(el=>el.classList.toggle('focus',id!=null));
document.querySelectorAll('.chip[data-m]').forEach(ch=>ch.classList.toggle('hl',id!=null&&+ch.dataset.m===id));
document.querySelectorAll('.hlclear').forEach(b=>b.hidden=state.hl==null);
document.querySelectorAll('.mgrid tr[data-mrow]').forEach(tr=>tr.classList.toggle('hl',id!=null&&+tr.dataset.mrow===id));
}
function patchWeek(){
const el=$('#weeklabel');if(!el)return;
el.textContent=weekLabel();
el.classList.toggle('cur',state.weekStart===thisSaturday());
document.querySelectorAll('#daypills [data-day]').forEach(p=>{const s=p.querySelector('small');if(s)s.textContent=ar(dayDate(+p.dataset.day).getDate());});
}
function shiftWeek(n){
const d=dayDate(n);state.weekStart=isoD(d);
patchWeek();
if(state.tab==='days')$('#daysWrap').innerHTML=daysTabHTML();
renderResults();scheduleSave();
}
function refreshResMain(){const rm=$('#resMain');if(rm){rm.innerHTML=resMainInner();paintHl();}}
function buildStaticUI(){
renderTabs();
 $('#daypills').innerHTML=DAYS.map((d,i)=>`<button class="pill dyp${state.days[i].on?' on':''}${state.days[i].dist==='near'?' thu':''}" data-act="wday" data-day="${i}" aria-pressed="${state.days[i].on}">${d}<small></small></button>`).join('');
{const s=$('#alldaysSw');s.setAttribute('aria-checked',String(state.useAllDays));s.querySelector('.sw').classList.toggle('on',state.useAllDays);}
patchWeek();
 $('#ratioseg').innerHTML=RATIOS.map((r,i)=>`<button class="${state.ratioIdx===i?'on':''}" data-act="ratio" data-i="${i}">${r.l}</button>`).join('');
state.vcap=visitCap();
updateVisitUI();updateGenUI();
 $('#daysWrap').innerHTML=daysTabHTML();
 $('#mIntro').innerHTML=memberIntroHTML();
 $('#mlist').innerHTML=state.members.map((m,i)=>memberCardHTML(m,i)).join('');
 $('#mAddWrap').innerHTML=`<button class="btn" data-act="madd">${icon('i-plus')} إضافة عضو</button>`;
 $('#lBulk').innerHTML=bulkBarHTML();
 $('#llist').innerHTML=state.locations.map((l,i)=>locationCardHTML(l,i)).join('');
patchLocIntro();
}
document.addEventListener('click',e=>{
const t=e.target.closest('[data-act]');if(!t)return;
const a=t.dataset;
switch(a.act){
case'tab':setTab(a.id);break;
case'wday':case'dsw':toggleDay(a.day!==undefined?+a.day:+a.d);break;
case'vstep':changeVisits(+a.v);break;
case'ratio':setRatio(+a.i);break;
case'alldays':{
state.useAllDays=!state.useAllDays;
const sw=t.querySelector('.sw');if(sw)sw.classList.toggle('on');
t.setAttribute('aria-checked',String(state.useAllDays));
if(state.useAllDays){
const wd=workingDays().length;
if(state.visits<wd){
if(state.vcap>=wd){state.visitsWanted=wd;recalcCap();toast('رُفع عدد الزيارات إلى '+ar(wd)+' لتغطية كل الأيام');}
else toast('أيام العمل تفوق الطاقة المتاحة — عطّل يومًا أو خفّف الإجازات');
}
}
markStale();break;
}
case'gen':startGen('normal');break;
case'genflex':startGen('flex');break;
case'plan-sel':case'rplan':selectPlan(+a.i);break;
case'copy':copyPlan(false);break;
case'copydet':copyPlan(true);break;
case'share':sharePlan();break;
case'print':window.print();break;
case'view':if(state.view!==a.v){state.view=a.v;refreshResMain();scheduleSave();}break;
case'hlclear':state.hl=null;paintHl();break;
case'undo':{const fn=state.undo;state.undo=null;$('#toast').classList.remove('show');if(fn)fn();break;}
case'week':shiftWeek(+a.v);break;
case'weeknow':state.weekStart=thisSaturday();shiftWeek(0);break;
case'hl':{const id=+a.m;state.hl=state.hl===id?null:id;paintHl();break;}
case'goresults':setTab('results');break;
case'gomain':setTab('plan');break;
case'dfav':setDayPref(+a.d,'fav',a.v,t);break;
case'ddist':setDayPref(+a.d,'dist',a.v,t);break;
case'mpool':{const m=byId(+a.m);if(m){m.pool=+a.v;segOn(t);$('#mIntro').innerHTML=memberIntroHTML();recalcCap();markStale();}break;}
case'mgender':{const m=byId(+a.m);if(m){m.gender=a.v;segOn(t);markStale();}break;}
case'mpref':{const m=byId(+a.m);if(m){m.pref=a.v;segOn(t);markStale();}break;}
case'moff':{const m=byId(+a.m);if(m){const i=m.off.indexOf(+a.day);if(i>=0)m.off.splice(i,1);else m.off.push(+a.day);t.classList.toggle('on');markStale();}break;}
case'mdel':removeMember(+a.m);break;
case'madd':addMember();break;
case'ltype':{const l=locById(+a.l);if(l){l.type=a.v;segOn(t);patchLocIntro();recalcCap();markStale();}break;}
case'ldist':{const l=locById(+a.l);if(l){l.dist=a.v;pillsOn(t);markStale();}break;}
case'lgen':{const l=locById(+a.l);if(l){l.genderRule=!l.genderRule;const sw=t.querySelector('.sw');if(sw)sw.classList.toggle('on');t.setAttribute('aria-checked',String(l.genderRule));markStale();}break;}
case'ldel':removeLocation(+a.l);break;
case'ladd':bulkAdd();break;
case'bst':{
state.bulk[a.k]=clamp(state.bulk[a.k]+ +a.v,0,9);
$('#b'+(a.k==='main'?'mainN':'conN')).textContent=ar(state.bulk[a.k]);
const bb=$('#baddBtn');if(bb)bb.disabled=state.bulk.main===0&&state.bulk.cont===0;
break;
}
case'capstep':{
const nv=clamp(state.cap[a.k]+ +a.v,1,3);
if(nv!==state.cap[a.k]){
state.cap[a.k]=nv;
if(state.cap.pairTotal<state.cap.mainPerDay+state.cap.conPerDay)state.cap.pairTotal=state.cap.mainPerDay+state.cap.conPerDay;
if(state.cap.pairWeighted<2*state.cap.mainPerDay+state.cap.conPerDay)state.cap.pairWeighted=2*state.cap.mainPerDay+state.cap.conPerDay;
 $('#setWrap').innerHTML=settingsTabHTML();
recalcCap();patchLocIntro();markStale();
}
break;
}
case'minch':{state.minChanges=!state.minChanges;const sw=t.querySelector('.sw');if(sw)sw.classList.toggle('on');t.setAttribute('aria-checked',String(state.minChanges));scheduleSave();break;}
case'autoregen':{state.autoRegen=!state.autoRegen;const sw=t.querySelector('.sw');if(sw)sw.classList.toggle('on');t.setAttribute('aria-checked',String(state.autoRegen));scheduleSave();break;}
case'resetall':{
if(confirm('سيتم مسح كل البيانات المحفوظة وإعادة تحميل الصفحة. متابعة؟')){
try{localStorage.removeItem('visitplan.v1');}catch(err){}
location.reload();
}
break;
}
case'ptoggle':{
state.pairs.enabled=!state.pairs.enabled;
const sw=t.querySelector('.sw');if(sw)sw.classList.toggle('on');
t.setAttribute('aria-checked',String(state.pairs.enabled));
const pb=$('#pblock');if(pb)pb.classList.toggle('off',!state.pairs.enabled);
markStale();break;
}
case'pmode':{state.pairs.mode=a.v;segOn(t);markStale();break;}
case'pkind':{const r=state.pairs.rules.find(x=>x.id===+a.r);if(r){r.kind=a.v;segOn(t);markStale();}break;}
case'padd':addPairRule();break;
case'pdel':removePairRule(+a.r);break;
case'gadd':addGoal();break;
case'gdel':removeGoal(+a.g);break;
case'gon':{const g=state.goals.find(x=>x.id===+a.g);if(g){g.on=!g.on;goalChanged();}break;}
case'gday':{const g=state.goals.find(x=>x.id===+a.g);if(g&&g.day!==+a.v){g.day=+a.v;goalChanged();}break;}
case'gppl':{const g=state.goals.find(x=>x.id===+a.g);if(g)toggleGoalPerson(g,+a.m);break;}
}
});
document.addEventListener('change',e=>{
const t=e.target.closest('select[data-act]');if(!t)return;
if(t.dataset.act==='gloc'){
const g=state.goals.find(x=>x.id===+t.dataset.g);
if(g){
g.loc=t.value?+t.value:null;
const loc=locById(g.loc);
if(loc&&loc.type==='contracted'){const ad=g.people.filter(id=>{const m=byId(id);return m&&m.pool===2;});if(ad.length>1)g.people=g.people.filter(id=>id!==ad[1]);}
goalChanged();
}
return;
}
const r=state.pairs.rules.find(x=>x.id===+t.dataset.r);if(!r)return;
if(t.dataset.act==='pa')r.a=+t.value;else r.b=+t.value;
if(r.a===r.b)toast('اختر عضوين مختلفين');
markStale();
});
let _paintT;
function schedulePaint(){
clearTimeout(_paintT);
_paintT=setTimeout(()=>{
renderResults();
if(state.tab==='settings'){const sw=$('#setWrap');if(sw)sw.innerHTML=settingsTabHTML();}
scheduleSave();
},250);
}
document.addEventListener('input',e=>{
const t=e.target.closest('input[data-name]');if(!t)return;
const id=+t.dataset.name;
const m=state.members.find(x=>x.id===id);
if(m){m.name=t.value.trim()||t.placeholder||'عضو';schedulePaint();return;}
const l=state.locations.find(x=>x.id===id);
if(l){l.name=t.value.trim()||'موقع';patchLocIntro();schedulePaint();}
});
document.addEventListener('keydown',e=>{
if(e.key==='Enter'&&e.target.matches('input.name')){e.target.blur();return;}
if(e.key==='Escape'&&state.hl!=null){state.hl=null;paintHl();return;}
if(e.ctrlKey||e.metaKey||e.altKey||e.target.closest('input,select,textarea'))return;
const k=e.key.toLowerCase();
if(k==='g'||k==='ل'){if(!state.running&&state.vcap>0)startGen('normal');e.preventDefault();}
else if(k==='c'||k==='ؤ'){if(state.plans.length)copyPlan(false);}
else if((e.key==='ArrowLeft'||e.key==='ArrowRight')&&state.plans.length&&(state.tab==='plan'||state.tab==='results')){
const n=state.plans.length,dir=e.key==='ArrowLeft'?1:-1;
selectPlan((state.selected+dir+n)%n);e.preventDefault();
}
});
document.addEventListener('pointerover',e=>{const c=e.target.closest('.chip[data-m]');if(c){hoverM=+c.dataset.m;paintHl();}});
document.addEventListener('pointerout',e=>{const c=e.target.closest('.chip[data-m]');if(c){hoverM=null;paintHl();}});
loadState();
buildStaticUI();
patchHeader();
renderResults();
setTimeout(()=>{state._quiet=true;startGen('normal');},320);
</script>
</body>
</html>
