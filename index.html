<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#f1f5f7;--card:#fbfcfd;--card2:#e7eef1;--line:#d6e1e6;
--ink:#333d4a;--mut:#6b7a88;
--teal:#3f7f8c;--teal-d:#35707c;--teal-soft:#e2eef1;
--sage:#7fa890;--sage-soft:#e4efe8;--sage-ink:#486d59;
--camel:#c3a179;--camel-soft:#f4eadc;--camel-ink:#8a6b45;
--lav:#9a92c4;--lav-soft:#eae7f4;--lav-ink:#6b639e;
--terra:#c4726a;--terra-soft:#f7e4e1;--terra-ink:#9c4f47;
--sh:0 2px 10px rgba(var(--shadow-rgb),.06);--sh2:0 8px 26px rgba(var(--shadow-rgb),.11);
--line-h:#bfd0d8;--faint:#c3ced5;--sage-line:#d5e6dc;--camel-line:#eddcc3;--lav-line:#d9d4ef;--terra-d:#b26058;--terra-line:#e8bcb5;--fail-line:#eccfc9;--miss-line:#e0b6b0;
--near-bg:#f8f7fc;--near-line:#ddd8f0;--sw-off:#cfdae0;--knob:#fff;--on-accent:#fff;--dot-m:#5d7383;
--toast-bg:#333d4a;--toast-ink:#fff;--toast-ic:#9fd3c0;--toast-hi:rgba(255,255,255,.14);--toast-hi2:rgba(255,255,255,.24);--shadow-rgb:51,61,74;--backdrop:rgba(51,61,74,.28);
color-scheme:light;
}
html[data-theme="dark"]{
--bg:#11171b;--card:#182026;--card2:#212b32;--line:#2c3942;--line-h:#3d4d58;
--ink:#e2e8ec;--mut:#93a2ae;--faint:#46545e;
--teal:#5ea8b5;--teal-d:#7cbcc7;--teal-soft:#1b3237;
--sage:#7fb08f;--sage-soft:#1c2c23;--sage-ink:#9ccdaa;--sage-line:#2d4536;
--camel:#cfa977;--camel-soft:#2e261b;--camel-ink:#e0c196;--camel-line:#4a3c29;
--lav:#a39bd6;--lav-soft:#26233a;--lav-ink:#c4bdf0;--lav-line:#3b3658;
--terra:#d47e75;--terra-d:#e0928a;--terra-soft:#33201e;--terra-ink:#f0aaa2;--terra-line:#5a332f;--fail-line:#4a2e2a;--miss-line:#5a3a35;
--near-bg:#1c1b2a;--near-line:#34304d;--sw-off:#34424b;--knob:#e9eef1;--on-accent:#0e171b;--dot-m:#8ea3b1;
--toast-bg:#e2e8ec;--toast-ink:#11171b;--toast-ic:#2f7d68;--toast-hi:rgba(0,0,0,.08);--toast-hi2:rgba(0,0,0,.16);--shadow-rgb:0,0,0;--backdrop:rgba(0,0,0,.5);
color-scheme:dark;
}
html{-webkit-text-size-adjust:100%}
body{font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.6;min-height:100vh;font-variant-numeric:tabular-nums;padding-bottom:70px}
::selection{background:var(--teal-soft)}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:0 20px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:26px 0 16px}
.brand{display:flex;align-items:center;gap:13px}
.mark{width:46px;height:46px;flex:none;filter:drop-shadow(0 2px 6px rgba(var(--shadow-rgb),.18))}
.mark .pulse{stroke-dasharray:26;stroke-dashoffset:26;animation:pulse 3.4s cubic-bezier(.4,0,.2,1) infinite}
@keyframes pulse{0%{stroke-dashoffset:26;opacity:0}10%{opacity:1}42%{stroke-dashoffset:0;opacity:1}62%{stroke-dashoffset:0;opacity:0}100%{stroke-dashoffset:26;opacity:0}}
h1{font-size:19px;font-weight:600;letter-spacing:-.2px}
.sub{font-size:12.5px;color:var(--mut)}
.hstats{display:flex;gap:8px;flex-wrap:wrap}
.schip{display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:500;color:var(--mut);box-shadow:var(--sh)}
.schip .ic{width:15px;height:15px;color:var(--teal)}
nav.tabs{position:sticky;top:10px;z-index:30;display:flex;gap:4px;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:4px;width:max-content;max-width:100%;margin:4px auto 22px;box-shadow:var(--sh);overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{display:inline-flex;align-items:center;gap:7px;border:none;background:transparent;font:inherit;font-size:13.5px;font-weight:500;color:var(--mut);padding:8px 17px;border-radius:999px;cursor:pointer;transition:.18s;white-space:nowrap}
.tab .ic{width:16px;height:16px}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--card);color:var(--teal);font-weight:600;box-shadow:var(--sh)}
.tnum{background:var(--teal-soft);color:var(--teal-d);border-radius:99px;font-size:10.5px;font-weight:600;padding:1px 7px}
.tnum:empty{display:none}
.tab.dirty::after{content:'';width:6px;height:6px;border-radius:50%;background:var(--terra);display:inline-block;margin-inline-start:4px}
.view{display:none}
.view.on{display:block;animation:viewin .32s cubic-bezier(.22,.85,.3,1)}
@keyframes viewin{from{opacity:0;transform:translateY(8px)}}
main>.view>*+*{margin-top:14px}
.stack>*+*{margin-top:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh);padding:16px 18px}
.kicker{font-size:11.5px;font-weight:600;color:var(--mut);letter-spacing:.3px;margin-bottom:9px}
.tiny{font-size:11.5px}.mut{color:var(--mut)}
.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:13.5px;font-weight:600;padding:8px 16px;border-radius:999px;cursor:pointer;transition:.16s;box-shadow:var(--sh)}
.btn .ic{width:16px;height:16px}
.btn:hover{transform:translateY(-1px);border-color:var(--line-h)}
.btn:active{transform:none}
.btn.primary{background:var(--teal);border-color:transparent;color:var(--on-accent)}
.btn.primary:hover{background:var(--teal-d);border-color:transparent}
.btn.big{padding:12px 26px;font-size:15.5px}
.btn.sm{padding:6px 13px;font-size:12.5px}
.btn.terra{background:var(--terra);border-color:transparent;color:var(--on-accent)}
.btn.terra:hover{background:var(--terra-d)}
.btn:disabled{opacity:.55;cursor:default;transform:none}
.icon-btn{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--mut);cursor:pointer;transition:.15s;flex:none}
.icon-btn:hover{color:var(--terra);border-color:var(--terra)}
.icon-btn .ic{width:15px;height:15px}
.pill{border:1.5px solid var(--line);background:var(--card);color:var(--mut);font:inherit;font-size:12.5px;font-weight:500;padding:4.5px 13px;border-radius:999px;cursor:pointer;transition:.14s}
.pill:hover{border-color:var(--line-h);color:var(--ink)}
.pill.on{background:var(--teal);border-color:var(--teal);color:var(--on-accent)}
.pill.on.thu{background:var(--lav);border-color:var(--lav)}
.pill.off.on{background:var(--terra-soft);border-color:var(--terra-line);color:var(--terra-ink)}
.pill.dst.on{background:var(--lav-soft);border-color:var(--lav-line);color:var(--lav-ink)}
.pill.dyp{padding:5.5px 15px;font-size:13px}
.pills{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.seg{display:inline-flex;background:var(--card2);border-radius:999px;padding:3px;gap:2px;flex:none}
.seg button{border:none;background:transparent;font:inherit;font-size:12px;font-weight:500;color:var(--mut);padding:4px 12px;border-radius:999px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:var(--sh)}
.pdot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
.pdot.d1{background:var(--sage)}.pdot.d2{background:var(--camel)}
.sw{width:40px;height:23px;border-radius:999px;background:var(--sw-off);border:1px solid var(--line);position:relative;cursor:pointer;transition:.2s;flex:none;display:inline-block}
.sw::after{content:'';position:absolute;top:2px;right:2px;width:17px;height:17px;border-radius:50%;background:var(--knob);box-shadow:0 1px 3px rgba(var(--shadow-rgb),.3);transition:.2s}
.sw.on{background:var(--teal);border-color:var(--teal)}
.sw.on::after{transform:translateX(-17px)}
.swlab{display:inline-flex;align-items:center;gap:7px;color:var(--mut);font-size:12px;cursor:pointer;border:none;background:none;font-family:inherit;padding:0}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3.5px 11px;font-size:13px;font-weight:500;border:1.5px solid transparent;transition:.15s;cursor:pointer}
.chip.c1{background:var(--sage-soft);border-color:var(--sage-line);color:var(--sage-ink)}
.chip.c2{background:var(--camel-soft);border-color:var(--camel-line);color:var(--camel-ink)}
.chip.pmiss{border-style:dashed;border-color:var(--miss-line)}
.chip.viol{border-color:var(--terra);box-shadow:0 0 0 2px var(--terra-soft)}
.chip.pbreak{border-style:dotted;border-color:var(--terra);box-shadow:0 0 0 2px var(--terra-soft)}
.dot{width:6px;height:6px;border-radius:50%;flex:none}
.dot.m{background:var(--dot-m)}.dot.f{background:var(--terra)}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:2.5px 10px;font-size:11px;font-weight:600;background:var(--card2);color:var(--mut)}
.bmain{background:var(--teal-soft);color:var(--teal-d)}
.bcon{background:var(--camel-soft);color:var(--camel-ink)}
.bdist{background:var(--lav-soft);color:var(--lav-ink)}
.stepper{display:inline-flex;align-items:center;gap:3px;background:var(--card2);border-radius:999px;padding:3px}
.stepper button{width:26px;height:26px;border-radius:50%;border:none;background:var(--card);cursor:pointer;font:inherit;font-weight:600;color:var(--teal);box-shadow:var(--sh);line-height:1}
.stepper b{min-width:30px;text-align:center;font-size:14px}
.stepper .lb{font-size:12px;color:var(--mut);padding:0 8px 0 5px;font-weight:500}
.ctrl{display:flex;flex-direction:column;gap:13px}
.cline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.clab{font-size:12px;font-weight:600;color:var(--mut);white-space:nowrap}
.split{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--mut);font-weight:500}
.wbtn{border:none;font:inherit;font-size:11.5px;font-weight:600;padding:4px 12px;border-radius:999px;background:var(--terra-soft);color:var(--terra-ink);cursor:pointer}
#stale,#rnote{opacity:0;transform:translateY(3px);transition:.25s;pointer-events:none}
#stale.show,#rnote.show{opacity:1;transform:none;pointer-events:auto}
#rnote{display:inline-flex;align-items:center;background:var(--terra-soft);color:var(--terra-ink);border-radius:999px;padding:3px 11px;font-size:11.5px;font-weight:600}
.dots{display:flex;gap:5px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--sage);animation:blink 1.1s infinite}
.dots i:nth-child(2){animation-delay:.18s;background:var(--camel)}
.dots i:nth-child(3){animation-delay:.36s;background:var(--lav)}
@keyframes blink{0%,100%{opacity:.25;transform:scale(.75)}50%{opacity:1;transform:scale(1)}}
.genstat{display:flex;align-items:center;gap:15px}
.gnums{font-size:13px;color:var(--mut)}
.gnums b{color:var(--ink)}
.reshead .rh-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.rh-name{display:flex;align-items:center;gap:8px}
.pname{font-weight:600;font-size:15px}
.best{background:var(--lav-soft);color:var(--lav-ink);font-size:10px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.okb{background:var(--sage-soft);color:var(--sage-ink);font-size:10px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.abad{background:var(--terra-soft);color:var(--terra-ink);font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:999px;white-space:nowrap}
.arow{display:flex;flex-wrap:wrap;gap:4px}
.acard .bad,.acard .bad b{color:var(--terra-ink)}
.dbtns{display:flex;gap:8px;margin-inline-start:auto;flex-wrap:wrap}
.strow{display:flex;flex-wrap:wrap;gap:5px}
.stat{background:var(--card2);border-radius:999px;padding:3px 11px;font-size:12px;color:var(--mut)}
.stat b{color:var(--ink)}
.stat.bad,.stat.bad b{background:var(--terra-soft);color:var(--terra-ink)}
.warnbox{display:flex;gap:8px;align-items:center;background:var(--terra-soft);color:var(--terra-ink);border-radius:12px;padding:8px 13px;font-size:12.5px;font-weight:500;margin-top:12px}
.warnbox .ic{width:15px;height:15px}
.dayblk{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh);padding:14px 16px}
.dayblk.thu{background:var(--near-bg);border-color:var(--near-line)}
.dayhead{display:flex;align-items:center;gap:9px;margin-bottom:11px;flex-wrap:wrap}
.dname{font-size:13px;font-weight:600;background:var(--card2);padding:4px 14px;border-radius:999px}
.dnear .dname,.daycard.thu .dname{background:var(--lav-soft);color:var(--lav-ink)}
.thutag{display:inline-flex;gap:5px;align-items:center;font-size:11px;font-weight:600;color:var(--lav-ink)}
.thutag .ic{width:12px;height:12px}
.vrow{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:9px 0;flex-wrap:wrap}
.vrow+.vrow{border-top:1px dashed var(--line)}
.vloc{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.vloc b{font-size:14px;font-weight:600}
.vteam{display:flex;gap:6px;flex-wrap:wrap}
.vteams{display:flex;flex-direction:column;gap:6px}
.vteams .vteam+.vteam{padding-top:6px;border-top:1px dashed var(--line)}
.fixrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.fixbtn{font-size:12px;padding:4px 12px;color:var(--teal-d);border-color:var(--teal)}
.gwarn.adv{flex-wrap:wrap;background:var(--camel-soft);color:var(--camel-ink)}
.gwarn.adv span{flex:1;min-width:160px}
.advcard .advrow{padding:9px 0;border-top:1px dashed var(--line);font-size:13px}
.advcard .advrow:first-of-type{border-top:none}
.advrow.error .advtxt{color:var(--terra-ink)}
.advrow.warn .advtxt{color:var(--camel-ink)}
.advrow.info .advtxt{color:var(--mut)}
.fixrow:empty{display:none}
.sched.focus .chip,.mloads.focus .chip{opacity:.32}
.sched.focus .chip.hl,.mloads.focus .chip.hl{opacity:1;border-color:var(--teal);box-shadow:0 0 0 2.5px var(--teal-soft)}
.alts-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.linky{background:none;border:none;color:var(--teal);font:inherit;font-size:12px;font-weight:600;cursor:pointer;padding:0}
.linky:hover{text-decoration:underline}
.astrip{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x proximity}
.astrip::-webkit-scrollbar{height:6px}
.astrip::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
.acard{min-width:156px;text-align:right;background:var(--card2);border:1.5px solid transparent;border-radius:16px;padding:10px 12px;cursor:pointer;font:inherit;display:flex;flex-direction:column;gap:8px;transition:.16s;scroll-snap-align:start}
.acard:hover{background:var(--card);border-color:var(--line);transform:translateY(-2px)}
.acard.sel{background:var(--card);border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
.aname{font-weight:600;font-size:13px}
.wstrip{display:flex;gap:7px;align-items:flex-end;min-height:24px}
.wcol{display:flex;flex-direction:column;gap:3px}
.wcol i{width:14px;height:7px;border-radius:4px;display:block}
.wcol i.m{background:var(--teal)}.wcol i.c{background:var(--camel)}.wcol i.e{background:var(--card2)}
.pstats{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px;color:var(--mut)}
.pstats b{color:var(--ink);font-weight:600}
.pstats .bad,.pstats .bad b{color:var(--terra-ink)}
.failcard{border-color:var(--fail-line)}
.fhead{display:flex;gap:9px;align-items:center;font-weight:600;color:var(--terra-ink);margin-bottom:10px}
.fhead .ic{width:18px;height:18px}
.flist{display:flex;flex-direction:column;gap:7px;margin:2px 0 14px}
.flist li{list-style:none;background:var(--terra-soft);color:var(--terra-ink);border-radius:12px;padding:8px 13px;font-size:13px;font-weight:500}
.fbtns{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.idle{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:13.5px}
.idle .ic{width:18px;height:18px;color:var(--teal)}
.introbar{display:flex;align-items:center;gap:9px;color:var(--mut);font-size:13px;flex-wrap:wrap}
.introbar .ic{color:var(--teal);width:17px;height:17px}
.introbar b{color:var(--ink)}
.daygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:12px;margin-top:14px}
.daycard .dc-head{display:flex;align-items:center;gap:9px;margin-bottom:11px;flex-wrap:wrap}
.daycard .swlab{margin-inline-start:auto}
.daycard.thu{background:var(--near-bg);border-color:var(--near-line)}
.daycard.off{opacity:.55}
.daycard.off .dc-body{pointer-events:none;opacity:.55}
.dd{position:relative;display:inline-flex;max-width:100%}
.dd-btn{display:inline-flex;align-items:center;justify-content:space-between;gap:10px;min-width:138px;max-width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:5px 13px 5px 10px;font:inherit;font-size:12.5px;font-weight:500;color:var(--ink);cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s;box-shadow:var(--sh)}
.dd-btn:hover{border-color:var(--line-h)}
.dd-btn[aria-expanded="true"]{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
.dd-btn.ph .dd-lab{color:var(--mut)}
.dd-lab{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.dd-lab .badge{padding:1px 8px;font-size:10.5px}
.dd-chev{width:14px;height:14px;color:var(--mut);transition:transform .2s ease}
.dd-btn[aria-expanded="true"] .dd-chev{transform:rotate(180deg);color:var(--teal)}
.ddmenu{position:fixed;z-index:80;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh2);padding:5px;overflow-y:auto;max-width:calc(100vw - 20px);opacity:0;transform:translateY(-4px) scale(.98);transform-origin:top right;transition:opacity .14s ease,transform .14s ease;scrollbar-width:thin}
.ddmenu.up{transform-origin:bottom right;transform:translateY(4px) scale(.98)}
.ddmenu.show{opacity:1;transform:none}
.ddmenu::-webkit-scrollbar{width:6px}
.ddmenu::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}

const pool=new Map();
let attempts=0;
const t0=performance.now(),softT=t0+560,hardT=t0+(flex?2000:1500),target=30;
let hasClean=false;
const enough=()=>pool.size>=target&&hasClean&&performance.now()>softT;
(function chunk(){
if(run!==genRun)return;
const c0=performance.now();
while(performance.now()-c0<22){
attempts++;
const slots=buildSlots(M,refSlots,attempts);
if(slots){
const sol=solveTeams(M,slots,{soft,refMD,refTR});
if(sol){
const h=hashSol(sol);
if(!pool.has(h)){
const pl=makePlan(M,sol,useRef?sel:null);
pool.set(h,pl);
if(pl.eval.clean)hasClean=true;
}
}
}
if(enough()||performance.now()>hardT||attempts>=9000)break;
}
if(run!==genRun)return;
const gn=$('#gn'),gf=$('#gf');
if(gn)gn.textContent=ar(attempts);
if(gf)gf.textContent=ar(pool.size);
if(enough()||performance.now()>hardT||attempts>=9000){finishGen(mode,M,pool,attempts);return;}
setTimeout(chunk,0);
})();
}
function debugPool(mode,all,attempts){
if(!DEBUG)return;
window.__lastPool=all;
console.groupCollapsed('[rushed-plan] seed='+SEED+' mode='+mode+' pool='+all.length+' attempts='+attempts);
all.forEach((p,i)=>{
console.log('#'+i,{rank:rankTuple(p).map(v=>+v.toFixed(4)),fair:+p.fair.toFixed(3),eval:p.eval,sim:p.sim});
if(mode!=='flex'&&p.eval.hardCount)console.error('[rushed-plan] solver bug: hard violations in normal mode',p.eval.hard);
});
console.groupEnd();
}
function finishGen(mode,M,pool,attempts){
state.running=false;state.lastRun={attempts,found:pool.size};
const all=[...pool.values()];
let needDiag=false;
if(!all.length){
state.plans=[];state.selected=null;state.flexOffer=mode!=='flex';
const found=advise(M).filter(f=>f.level==='error').map(f=>f.text);
state.fail=found.slice(0,3);
if(!state.fail.length)state.fail=['لا توجد خطة تستوفي كل القواعد بهذه الإعدادات'];
if(mode==='flex')state.fail.unshift('لا حل حتى مع الوضع المرن');
needDiag=true;
}else{
all.forEach(p=>p.score=scorePlan(p));
all.sort(comparePlans);
debugPool(mode,all,attempts);
const want=6,picked=[all[0]];
const fill=list=>{
let thr=0.34;
while(picked.length<want){
for(const p of list){
if(picked.length>=want)break;
if(!picked.includes(p)&&picked.every(q=>diffPlans(p,q)>=thr))picked.push(p);
}
if(thr<=0)break;
thr=thr>0.04?thr/2:0;
}
};
fill(all.filter(p=>p.eval.clean));
fill(all.filter(p=>!p.eval.clean));
picked.sort(comparePlans);
state.plans=picked;state.selected=0;state.flexOffer=false;state.fail=null;state.failFixes=[];state.diagBusy=false;
if(!state._quiet)recordHistory(picked[0]);
}
updateGenUI();updateLastRun();renderResults();
const tn=$('#tnum');if(tn)tn.textContent=state.plans.length?ar(state.plans.length):'';
if(all.length&&!state._quiet)toast('جاهزة: '+plural(state.plans.length,'خطة واحدة','خطتان','خطط','خطة'));
state._quiet=false;
if(needDiag)setTimeout(runDiagnosis,30);
}

const nm=id=>{const m=byId(id);return m?m.name:'؟';};
function planText(p){
const days=[...new Set(p.rows.map(r=>r.day))].sort((a,b)=>a-b);
const out=['خطة الزيارات — '+weekLabel()];
for(const d of days){
out.push('','▪ '+DAYS[d]+' '+dateOf(d));
const seenL=new Set();
for(const r of p.rows.filter(x=>x.day===d)){
if(seenL.has(r.loc.id))continue;seenL.add(r.loc.id);
const same=p.rows.filter(x=>x.day===d&&x.loc.id===r.loc.id);
out.push((same.some(x=>x.goal)?'◎ ':'')+r.loc.name+': '+same.map(x=>x.team.map(nm).join('، ')).join(' | '));
}
}
return out.join('\n');
}
function detailText(p){
const lines=[];
for(const m of state.members){
const rs=p.rows.filter(r=>r.team.includes(m.id));
if(rs.length)lines.push(m.name+(m.vmode==='exact'?' ['+rs.length+'/'+m.vmin+']':m.vmode==='range'?' ['+rs.length+'/'+m.vmin+'–'+m.vmax+']':'')+': '+rs.sort((a,b)=>a.day-b.day).map(r=>DAYS[r.day]+' ('+r.loc.name+')').join('، '));
}
return 'جدول الأعضاء — '+weekLabel()+'\n\n'+lines.join('\n');
}
async function copyPlan(det){
const p=state.plans[state.selected];if(!p)return;
const txt=det?detailText(p):planText(p);
try{await navigator.clipboard.writeText(txt);}
catch(err){
const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();
}
toast(det?'نُسخ جدول الأعضاء':'نُسخ الجدول');
}
async function sharePlan(){
const p=state.plans[state.selected];if(!p)return;

function recalcCap(){
resetCaches();
state.vcap=visitCap();
const maxV=Math.max(1,state.vcap);
const derived=clamp(Math.max(state.visitsWanted,goalCounts().n),1,maxV);
if(derived!==state.visits){
state.visits=derived;
if(derived<state.visitsWanted)toast('خُفِّض عدد الزيارات إلى '+ar(derived));
else if(derived>state.visitsWanted){state.visitsWanted=derived;toast('رُفع عدد الزيارات إلى '+ar(derived)+' لتغطية الأهداف');}
}
updateVisitUI();

}

}

function addLoc(type){

const used=new Set(state.locations.map(l=>l.name));
let n=state.locations.filter(l=>l.type===type).length+1;

const l={id:nid(),name:base+ar(n),type,dist:'',genderRule:type==='main',maxWeek:0,closed:[],seats:null,dup:null,only:[],ban:[]};

function removeMember(id){

function ddPlace(){
if(!dd.btn)return;
const menu=$('#ddmenu'),r=dd.btn.getBoundingClientRect();
if(!r.width){ddClose(true);return;}
const vh=window.innerHeight,vw=window.innerWidth;
const w=Math.min(Math.max(r.width,210),vw-20);
menu.style.width=w+'px';
menu.style.maxHeight='';
const h=Math.min(menu.scrollHeight,300);
const below=vh-r.bottom-12,above=r.top-12;
const up=below<h&&above>below;
menu.classList.toggle('up',up);
menu.style.maxHeight=Math.max(120,Math.min(300,up?above:below))+'px';
menu.style.top=(up?Math.max(10,r.top-6-Math.min(h,above)):r.bottom+6)+'px';
menu.style.left=clamp(r.right-w,10,vw-w-10)+'px';
}
function ddClose(silent){
const menu=$('#ddmenu');
if(!dd.btn)return;
const b=dd.btn;dd.btn=null;
b.setAttribute('aria-expanded','false');
menu.classList.remove('show');
if(silent)menu.hidden=true;else setTimeout(()=>{if(!dd.btn)menu.hidden=true;},140);
if(!silent&&document.activeElement&&menu.contains(document.activeElement))b.focus({preventScroll:true});
}
function ddPick(v){
const b=dd.btn;if(!b)return;
const kind=b.dataset.kind,ref=+b.dataset.ref;
ddClose();
if(String(v)===b.dataset.val)return;
const raw=v;v=+v;
if(kind==='mrest'){
const m=byId(ref);if(!m)return;
if(raw==='g'){m.rest=null;m.restCustom=false;}
else if(raw==='c'){m.rest=m.rest||{...state.rest};m.restCustom=true;}
else{const q=PRESETS.find(x=>x.k===raw);if(!q)return;m.rest={rest:q.rest,maxRun:q.maxRun};m.restCustom=false;}
refreshMembers();recalcCap();markStale();
return;
}
if(kind==='gloc'){
const g=state.goals.find(x=>x.id===ref);if(!g)return;
g.loc=v;
const loc=locById(v);
if(loc&&!goalIsCustom(g)){const sh=shapeOf(loc);for(const q of[1,2]){const same=g.people.filter(id=>{const m=byId(id);return m&&m.pool===q;});if(same.length>sh[q]){const drop=same.slice(sh[q]);g.people=g.people.filter(id=>!drop.includes(id));}}}
goalChanged();
}else if(kind==='pa'||kind==='pb'){
const r=state.pairs.rules.find(x=>x.id===ref);if(!r)return;
if(kind==='pa')r.a=v;else r.b=v;
if(r.a===r.b)toast('اختر عضوين مختلفين');
refreshSettings();markStale();
}
}
function ddKey(e){
const menu=$('#ddmenu');
const opts=[...menu.querySelectorAll('.dd-opt:not(:disabled)')];
const i=opts.indexOf(document.activeElement);
if(e.key==='Escape'){e.preventDefault();ddClose();return true;}
if(e.key==='ArrowDown'||e.key==='ArrowUp'){
e.preventDefault();
const n=opts.length;if(!n)return true;
const j=i<0?0:(i+(e.key==='ArrowDown'?1:-1)+n)%n;
opts[j].focus();opts[j].scrollIntoView({block:'nearest'});return true;
}
if(e.key==='Home'||e.key==='End'){e.preventDefault();const o=opts[e.key==='Home'?0:opts.length-1];if(o)o.focus();return true;}
if(e.key==='Tab'){ddClose();return false;}
return true;
}

case'cfscope':{const r=state.conflicts.find(x=>x.id===+a.r);if(r){if(a.v==='pool1'||a.v==='pool2'){r.scope='pool';r.pool=a.v==='pool1'?1:2;}else r.scope=a.v;conflictChanged();}break;}
case'cfmem':{const r=state.conflicts.find(x=>x.id===+a.r);if(r){r.ids=r.ids||[];const id=+a.m,k=r.ids.indexOf(id);if(k>=0)r.ids.splice(k,1);else r.ids.push(id);conflictChanged();}break;}
case'dupmode':{state.dup.mode=a.v;refreshSettings();refreshLocations();recalcCap();patchLocIntro();markStale();break;}
case'duppeople':state.dup.people=a.v;refreshSettings();recalcCap();patchLocIntro();markStale();break;
case'dupspread':state.dup.spread=state.dup.spread==='avoid'?'free':'avoid';refreshSettings();markStale();break;
case'advall':state.advAll=!state.advAll;morph('#advWrap',advisorHTML());break;
case'fix':{try{applyFix(JSON.parse(a.fix));}catch(err){}break;}
case'theme':applyTheme(a.v);break;
case'gmaxon':state.gmaxOn=!state.gmaxOn;refreshSettings();recalcCap();refreshGoals();markStale();break;
case'gmaxstep':{const nv=clamp(state.gmax+ +a.v,1,7);if(nv!==state.gmax){state.gmax=nv;refreshSettings();recalcCap();refreshGoals();markStale();}break;}
case'prio':state.priority=a.v;segOn(t);markStale();break;
case'carry':state.carryWeek=!state.carryWeek;refreshSettings();markStale();break;
case'bkexp':exportBackup();break;
case'bkimp':$('#impFile').click();break;
case'mtypes':{const m=byId(+a.m);if(m){m.types=a.v;segOn(t);refreshGoals();markStale();}break;}
case'mpday':{const m=byId(+a.m);if(m){const d=+a.day,i=m.prefDays.indexOf(d);if(i>=0)m.prefDays.splice(i,1);else m.prefDays.push(d);t.classList.toggle('on');markStale();}break;}
case'lclosed':{const l=locById(+a.l);if(l){const d=+a.day,i=l.closed.indexOf(d);if(i>=0)l.closed.splice(i,1);else l.closed.push(d);refreshLocations();refreshGoals();recalcCap();markStale();}break;}
case'mvmode':{const m=byId(+a.m);if(m&&(m.vmode||'auto')!==a.v){m.vmode=a.v;if(a.v==='exact'){if(!m.vmin)m.vmin=1;m.vmax=m.vmin;}else if(a.v==='range'){if(!m.vmin&&!m.vmax){m.vmin=1;m.vmax=2;}else if(m.vmax<m.vmin)m.vmax=m.vmin;}refreshMembers();recalcCap();markStale();}break;}
case'mvstep':{const m=byId(+a.m);if(m){const nv=clamp(m[a.k]+ +a.v,0,7);if(nv!==m[a.k]){m[a.k]=nv;if(m.vmode==='exact')m.vmax=m.vmin;else if(a.k==='vmin'&&m.vmax<m.vmin)m.vmax=m.vmin;else if(a.k==='vmax'&&m.vmin>m.vmax)m.vmin=m.vmax;refreshMembers();recalcCap();markStale();}}break;}
case'restpre':state.rest={rest:+a.rest,maxRun:+a.run};state.restCustom=false;restChanged();break;
case'restcustom':state.restCustom=true;refreshSettings();break;
case'reststep':{const nv=clamp(state.rest[a.k]+ +a.v,a.k==='rest'?0:1,3);if(nv!==state.rest[a.k]){state.rest[a.k]=nv;restChanged();}break;}
case'restcal':state.restCalendar=!state.restCalendar;restChanged();break;
case'mreststep':{const m=byId(+a.m);if(m&&m.rest){const nv=clamp(m.rest[a.k]+ +a.v,a.k==='rest'?0:1,3);if(nv!==m.rest[a.k]){m.rest[a.k]=nv;refreshMembers();recalcCap();markStale();}}break;}
case'themecycle':cycleTheme();break;
}
});
window.addEventListener('resize',()=>ddPlace());
document.addEventListener('scroll',e=>{if(dd.btn&&!(e.target&&e.target.id==='ddmenu'))ddPlace();},true);
let _paintT;
function schedulePaint(){
clearTimeout(_paintT);
_paintT=setTimeout(()=>{
renderResults();
if(state.tab==='settings')refreshSettings();
if(state.tab==='goals')refreshGoals();
scheduleSave();
},250);
}
document.addEventListener('input',e=>{
const t=e.target.closest('input[data-name]');if(!t)return;
const id=+t.dataset.name;
const m=state.members.find(x=>x.id===id);
if(m){m.name=t.value.trim()||t.placeholder||'عضو';schedulePaint();return;}
const l=state.locations.find(x=>x.id===id);
if(l){l.name=t.value.trim()||'موقع';patchLocIntro();schedulePaint();}
});
document.addEventListener('keydown',e=>{
if(!$('#dlg').hidden){
if(e.key==='Escape'){e.preventDefault();closeDlg(false);}
else if(e.key==='Tab'){const bs=[...$('#dlg').querySelectorAll('button')];const i=bs.indexOf(document.activeElement);e.preventDefault();bs[(i+(e.shiftKey?-1:1)+bs.length)%bs.length].focus();}
return;
}
if(dd.btn){if(ddKey(e))return;}
if((e.key==='ArrowDown'||e.key==='ArrowUp')&&e.target.matches('.dd-btn')){e.preventDefault();ddOpen(e.target);return;}
if(e.key==='Enter'&&e.target.matches('input.name')){e.target.blur();return;}
if(e.key==='Escape'&&state.hl!=null){state.hl=null;paintHl();return;}
if(e.ctrlKey||e.metaKey||e.altKey||e.target.closest('input,select,textarea,.dd-btn'))return;
const k=e.key.toLowerCase();
if(k==='g'||k==='ل'){if(!state.running&&state.vcap>0)startGen('normal');e.preventDefault();}
else if(k==='c'||k==='ؤ'){if(state.plans.length)copyPlan(false);}
else if(k==='t'||k==='ف'){cycleTheme();}
else if((e.key==='ArrowLeft'||e.key==='ArrowRight')&&state.plans.length&&(state.tab==='plan'||state.tab==='results')){
const n=state.plans.length,dir=e.key==='ArrowLeft'?1:-1;
selectPlan((state.selected+dir+n)%n);e.preventDefault();
}
});
document.addEventListener('pointerover',e=>{const c=e.target.closest('.chip[data-m]');if(c){hoverM=+c.dataset.m;paintHl();}});
document.addEventListener('pointerout',e=>{const c=e.target.closest('.chip[data-m]');if(c){hoverM=null;paintHl();}});
state.members.forEach(m=>{m.types='any';m.prefDays=[];});
state.locations.forEach(l=>{l.closed=[];});
loadState();
initTheme();
document.addEventListener('change',e=>{if(e.target&&e.target.id==='impFile')importBackup(e.target);});
buildStaticUI();
patchHeader();
renderResults();
refreshGoals();
refreshAdvisor();
setTimeout(()=>document.body.classList.add('ready'),900);
setTimeout(()=>{state._quiet=true;startGen('normal');},320);
</script>
</body>
</html>
